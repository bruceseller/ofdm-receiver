<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFDM Sender</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --faint: #9a9993; --line: #e2e1dc;
    --ok: #2f8f5b; --bad: #c8463d; --idle: #e4e3de; --accent: #2d5fd3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29c; --faint: #75746f; --line: #343431;
      --ok: #4cb27b; --bad: #e0675d; --idle: #34342f; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  h1 { font-size: 16px; font-weight: 650; margin: 0 auto 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  select, input[type=range] { font: inherit; font-size: 13px; color: var(--ink); }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
  .icon { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
  .icon svg { width: 20px; height: 20px; }
  .icon.live { background: var(--accent); border-color: var(--accent); color: #fff; }
  .icon:disabled { opacity: .45; cursor: default; }
  .icon:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #stopIcon { display: none; }
  .icon.live #playIcon { display: none; }
  .icon.live #stopIcon { display: block; }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .view { aspect-ratio: 1; display: grid; place-items: center; background: var(--idle); position: relative; }
  .view img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .view.has-image img { display: block; }
  .view pre { display: none; margin: 0; padding: 16px; width: 100%; height: 100%; overflow-y: auto; background: var(--panel);
    white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.6 ui-serif, Georgia, serif; }
  .view.has-text pre { display: block; }
  label.pick { color: var(--muted); font-size: 14px; text-align: center; padding: 16px; cursor: pointer; }
  label.pick b { color: var(--accent); font-weight: 600; }
  .view.has-image label.pick, .view.has-text label.pick { display: none; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .controls { margin-top: 12px; display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
  .controls .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  .status { display: flex; align-items: center; gap: 8px; flex: none; white-space: nowrap;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status[hidden] { display: none; }
  .ring { width: 44px; height: 44px; flex: none; }
  /* The return path: hollow while listening with nothing heard from the receiver, solid once a burst has been, and a
     blink on each burst. */
  #link { width: 12px; height: 12px; flex: none; overflow: visible; }
  #link[hidden] { display: none; }
  #link circle { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  #link.heard circle { fill: var(--accent); }
  #link.blink circle { animation: blink .6s ease-out; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0% { transform: scale(1.8); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: var(--idle); }
  .ring .done { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s; }
  .ring text { fill: var(--ink); font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  details.fold { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.fold summary { cursor: pointer; font-size: 13px; color: var(--faint); }
  .links { margin-top: 10px; font-size: 13px; color: var(--faint); }
  .links a, .links button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .readout { margin-top: 6px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .readout b { color: var(--ink); font-weight: 600; }
  .readout .row { display: flex; flex-wrap: wrap; column-gap: 14px; }
  #log { margin: 4px 0 0; color: var(--faint); white-space: pre-wrap; max-height: 5.6em; overflow-y: auto; }
  .footer { margin-top: 6px; color: var(--faint); }
  .footer a, .footer button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  #warn { color: var(--bad); font-size: 13px; margin-top: 10px; }
  #warn:empty { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <button class="icon" id="toggle" disabled title="Send" aria-label="Send">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="stopIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <h1>OFDM Sender</h1>
    <div class="status" id="status" hidden>
      <span id="progressText"></span>
      <svg id="link" viewBox="0 0 12 12" role="img" aria-label="Heard from the receiver" hidden><circle cx="6" cy="6" r="4.5"/></svg>
      <svg class="ring" viewBox="0 0 52 52" role="img" aria-label="Message sent">
        <circle class="track" cx="26" cy="26" r="22"/>
        <circle class="done" id="ringArc" cx="26" cy="26" r="22" transform="rotate(-90 26 26)"/>
        <text id="ringText" x="26" y="26">0%</text></svg>
    </div>
  </header>

  <input type="file" id="file" accept="image/*,text/*,*/*">
  <section class="stage">
    <div class="view" id="view">
      <img id="image" alt="The image as it will be sent">
      <pre id="text"></pre>
      <label class="pick" id="pick" for="file">
        <b>Choose an image</b> (or a photo, or any file) to send.<br>Images are scaled to fit the time per pass below.
      </label>
    </div>
  </section>

  <div class="controls">
    <div class="row">
      <label>Time per pass <input type="range" id="seconds" min="8" max="90" step="1" value="25"> <b id="secondsValue">25 s</b></label>
    </div>
  </div>

  <div id="warn"></div>

  <details class="fold">
  <summary>Details</summary>
  <div class="readout">
    <div class="row">
      <span>sending <b id="what">–</b></span>
      <span>size <b id="bytes">–</b></span>
      <span>pass <b id="pass">–</b></span>
    </div>
    <div class="row">
      <span>t <b id="time">–</b></span>
      <span>frames <b id="frames">–</b></span>
      <span>passes <b id="passes">–</b></span>
    </div>
    <div class="row" id="backRow">
      <span>mic <b id="mic">–</b></span>
      <span>map <b id="map">–</b></span>
      <span>heard <b id="heard">–</b></span>
    </div>
    <pre id="log"></pre>
    <div class="footer"><span id="description">Loading the transmitter…</span></div>
  </div>
  </details>
  <div class="links"><button id="change">Choose another file</button> · <a id="receiverLink" href="../">Receiver</a></div>
</main>

<script type="module">
// Sends an image (or any file) as sound, for the receiver page to decode. The layout must match the receiver's:
// the receiver link below passes it on. The default is bit loading on 200 subcarriers, the receiver page's default;
// others by parameter (?qam=qpsk,16 or ?qam=qpsk&subcarriers=100, with ?rate= their bit/s at map 0 to size images). Images are scaled and JPEG-encoded to fit the time per
// pass at the layout's rate, and sent as a small thumbnail followed by the full image: browsers only make baseline
// JPEGs, which would otherwise show only their top rows until complete. The receiver shows the thumbnail scaled up
// until the full image has arrived. ?carrier= moves the band (5000 for a mic that stops at 8 kHz).
// With bit loading, the page also listens on its microphone for the receiver's bursts around ?burst= Hz (default
// 10000: quiet to the ear, above room noise, and the speaker's harmonics fall above the 14 kHz band; a mic that
// stops at 8 kHz needs 3200): maps for the next frames, the blocks the receiver still lacks (sent next), and done
// (sending stops).
const params = new URLSearchParams(location.search);
const carrier = Number(params.get('carrier') ?? 14000);
const burst = Number(params.get('burst') ?? 10000);
const qam = (params.get('qam') ?? 'adapt').replace(/[ ,]/g, '+');
const subcarriers = Number(params.get('subcarriers') ?? 200);
const adapt = qam === 'adapt';
// The rate (information bits per second) images are sized for. With bit loading, a phone close by: the backchannel
// takes the link well above map 0's 2120 bit/s.
const rate = Number(params.get('rate') ?? (adapt ? 5000 : 2120));
const RATE = 48000;
const LEAD_SECONDS = 5;      // the message's start comes round about this long after the frames begin
const MAX_BYTES = 65535;     // MessageFraming's limit
const THUMB_SIDE = 64;
const SIDES = [1280, 1024, 896, 768, 640, 560, 480, 400, 360, 320, 280, 240, 200, 160, 128, 96, 64];
const QUALITIES = [0.75, 0.6, 0.5, 0.4, 0.3];
const MIN_QUALITY = 0.4;     // a smaller image at this quality looks better than a larger one below it

const $ = id => document.getElementById(id);
const worker = new Worker('../worker.js?v=05863759e8', { type: 'module' });
let file = null, message = null;      // the chosen file, and the bytes that will be sent
let audio = null, timer = null, wakeLock = null, scheduled = 0, waiting = false, started = 0, frames = 0;
let mic = null, micPeak = 0, sentBytes = 0, delivered = false;
let confirmed = null;    // the share of the message the receiver last reported having, or null

const seconds = () => Number($('seconds').value);

function log(line) {
  const el = $('log');
  el.textContent += (el.textContent ? '\n' : '') + line;
  el.scrollTop = el.scrollHeight;
}

function updateLink() {
  const url = new URL('../', location.href);
  for (const key of ['qam', 'subcarriers', 'carrier', 'burst']) if (params.has(key)) url.searchParams.set(key, params.get(key));
  $('backRow').hidden = !adapt;
  $('receiverLink').href = url.href;
}

const RING = 2 * Math.PI * 22;

/** The ring: the share of the message sent, held short of full until the receiver says it has it all. */
function showProgress(share, text) {
  const arc = $('ringArc');
  arc.style.strokeDasharray = RING;
  arc.style.strokeDashoffset = RING * (1 - share);
  arc.style.visibility = share > 0 ? 'visible' : 'hidden';
  $('ringText').textContent = `${Math.floor(100 * share)}%`;
  $('progressText').textContent = text;
}

// --- What is sent

/** A JPEG of the bitmap with its longest side at most `side` pixels. */
function jpeg(bitmap, side, quality) {
  const scale = Math.min(1, side / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise(done => canvas.toBlob(blob => done({ blob, width: canvas.width, height: canvas.height }), 'image/jpeg', quality));
}

/**
 * The largest image that fits `budget` bytes at MIN_QUALITY or better, at the best quality that fits; failing
 * that, the smallest side at whatever quality fits.
 */
async function fit(bitmap, budget) {
  const longest = Math.max(bitmap.width, bitmap.height);
  let fallback = null;
  for (const side of SIDES.filter(s => s <= longest).concat(longest < SIDES.at(-1) ? [longest] : [])) {
    for (const quality of QUALITIES) {
      const j = await jpeg(bitmap, side, quality);
      if (j.blob.size <= budget) {
        if (quality >= MIN_QUALITY) return { ...j, quality };
        fallback = { ...j, quality };
        break;
      }
    }
  }
  return fallback;
}

async function prepare() {
  if (!file) return;
  $('status').hidden = true;
  const budget = Math.min(MAX_BYTES, Math.floor(rate * seconds() / 8));
  $('warn').textContent = '';
  let bitmap = null;
  if (file.type.startsWith('image/')) {
    try {
      bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch {
      bitmap = null;
    }
  }
  if (!bitmap) {
    // Any other file goes as it is (text shows as text on the receiver).
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes.length > MAX_BYTES) {
      $('warn').textContent = `${file.name} is ${bytes.length} bytes; at most ${MAX_BYTES} can be sent.`;
      message = null;
    } else {
      message = bytes;
      $('view').className = 'view has-text';
      $('text').textContent = new TextDecoder().decode(bytes.subarray(0, 4000));
      $('what').textContent = file.name;
    }
  } else {
    const thumb = await jpeg(bitmap, THUMB_SIDE, 0.5);
    const full = await fit(bitmap, budget - thumb.blob.size);
    if (!full) {
      $('warn').textContent = 'Even the smallest image does not fit; allow more time per pass.';
      message = null;
    } else {
      const parts = [new Uint8Array(await thumb.blob.arrayBuffer()), new Uint8Array(await full.blob.arrayBuffer())];
      message = new Uint8Array(parts[0].length + parts[1].length);
      message.set(parts[0]);
      message.set(parts[1], parts[0].length);
      const img = $('image');
      if (img.src) URL.revokeObjectURL(img.src);
      img.src = URL.createObjectURL(full.blob);
      $('view').className = 'view has-image';
      $('what').textContent = `${full.width}×${full.height} JPEG q${full.quality} + ${thumb.width}×${thumb.height} thumbnail`;
    }
  }
  if (message) {
    $('bytes').textContent = `${message.length} B`;
    $('pass').textContent = `${Math.round(message.length * 8 / rate)} s at ${rate} bit/s`;
  } else {
    $('bytes').textContent = $('pass').textContent = '–';
  }
  $('toggle').disabled = !message;
}

// --- Sending: the worker generates the signal in blocks, which are scheduled back to back on the AudioContext,
// kept about half a second ahead.

const BLOCK = 9600;          // 0.2 s
const AHEAD = 0.5;

worker.onmessage = ({ data }) => {
  if (data.type === 'transmitting') {
    $('description').textContent = data.description;
    log(data.description);
  } else if (data.type === 'pulled') {
    waiting = false;
    if (!audio) return;
    const buffer = audio.createBuffer(1, data.samples.length, RATE);
    buffer.copyToChannel(data.samples, 0);
    const source = audio.createBufferSource();
    source.buffer = buffer;
    source.connect(audio.destination);
    scheduled = Math.max(scheduled, audio.currentTime + 0.05);
    source.start(scheduled);
    scheduled += buffer.duration;
    for (const e of data.events) {
      if (e.type === 'txFrame') {
        frames++;
        sentBytes += e.bytes;
      }
    }
    fill();
  } else if (data.type === 'events') {
    data.events.forEach(heard);
  }
};

/** A burst from the receiver. */
function heard(e) {
  const at = `${e.seconds.toFixed(1)} s`;
  if (!e.ignored && !e.otherMessage) {
    const link = $('link');
    link.classList.add('heard');
    link.classList.remove('blink');
    void link.getBoundingClientRect();   // restarts the animation
    link.classList.add('blink');
  }
  if (e.ignored) {
    log(`${at}  ignored a ${e.kind} burst from before this transmission`);
  } else if (e.kind === 'status') {
    if (e.otherMessage) {
      log(`${at}  heard a report on another message`);
    } else if (e.done) {
      const t = audio ? audio.currentTime - started : 0;
      log(`${at}  the receiver has it all: delivered in ${t.toFixed(0)} s`);
      $('heard').textContent = 'done';
      delivered = true;
      showProgress(1, `delivered in ${t.toFixed(0)} s`);
      stop();
      $('description').textContent = `Delivered ${message.length} bytes in ${t.toFixed(0)} s.`;
    } else {
      log(`${at}  the receiver lacks ${e.missing} block${e.missing === 1 ? '' : 's'}: sending them next`);
      const blocks = Math.ceil(message.length / Math.max(1, Math.ceil(message.length / 64)));   // MessageCursor's
      confirmed = Math.max(0, (blocks - e.missing) / blocks);
      $('heard').textContent = `${e.missing} missing`;
    }
  } else {
    $('map').textContent = `${e.id}, ${e.bitsPerSecond} bit/s`;
    $('heard').textContent = `${e.kind === 'fallback' ? 'fallback' : 'map ' + e.id} (${e.correlation})`;
    log(`${at}  ${e.kind === 'fallback' ? 'fallback to map 0' : 'map ' + e.id}: ${e.bitsPerSecond} bit/s next`);
  }
}
worker.onerror = e => { $('warn').textContent = 'The transmitter failed to load: ' + e.message; };

function fill() {
  if (audio && !waiting && scheduled - audio.currentTime < AHEAD) {
    waiting = true;
    worker.postMessage({ type: 'pull', length: BLOCK });
  }
}

function tick() {
  fill();
  if (mic) {
    $('mic').textContent = `${(20 * Math.log10(micPeak + 1e-9)).toFixed(0)} dBFS pk`;
    micPeak = 0;
  }
  const t = audio.currentTime - started;
  $('time').textContent = `${t.toFixed(0)} s`;
  const frameSeconds = 0.752;
  const sent = Math.max(0, Math.floor((t - 1.75) / frameSeconds));
  $('frames').textContent = adapt ? `${frames} started` : `${sent}`;
  const passes = Math.max(0, (t - 1.75 - LEAD_SECONDS) * rate / 8 / message.length);
  $('passes').textContent = passes.toFixed(1);
  // With bit loading, what the receiver last reported having, or until it reports, the bytes the frames carried; held
  // short of full until it says done. Otherwise the first pass at the nominal rate.
  const share = adapt ? Math.min(0.99, confirmed ?? sentBytes / message.length) : Math.min(1, passes);
  showProgress(share, `${t.toFixed(0)} s`);
}

async function start() {
  if (!message) return;
  audio = new AudioContext({ sampleRate: RATE, latencyHint: 'playback' });
  if (audio.sampleRate !== RATE) {
    $('warn').textContent = `The browser runs audio at ${audio.sampleRate} Hz, not ${RATE} Hz; receivers will not lock.`;
  }
  await audio.resume();
  try {
    wakeLock = await navigator.wakeLock?.request('screen'); // a locked phone stops playing
  } catch {
    wakeLock = null;
  }
  worker.postMessage({ type: 'transmit', message: message.buffer.slice(0), lead: LEAD_SECONDS,
    layout: { qam, carrier, symbols: 8, fft: 256, subcarriers, prefix: 20, burst } });
  if (adapt) await listen();
  sentBytes = 0;
  delivered = false;
  confirmed = null;
  $('link').toggleAttribute('hidden', !mic);
  $('link').classList.remove('heard', 'blink');
  $('status').hidden = false;
  showProgress(0, '');
  started = audio.currentTime;
  scheduled = 0;
  frames = 0;
  waiting = false;
  fill();
  timer = setInterval(tick, 100);
  setLive(true);
  log(`sending ${message.length} bytes`);
}

/** The microphone, for the receiver's bursts: on the same AudioContext, through the capture worklet. */
async function listen() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'play-and-record';
    mic = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    await audio.audioWorklet.addModule('../capture.js');
    const capture = new AudioWorkletNode(audio, 'capture', { numberOfOutputs: 1 });
    capture.port.onmessage = ({ data }) => {
      for (let i = 0; i < data.length; i++) micPeak = Math.max(micPeak, Math.abs(data[i]));
      worker.postMessage({ type: 'heard', samples: data }, [data.buffer]);
    };
    const mute = audio.createGain();
    mute.gain.value = 0;
    audio.createMediaStreamSource(mic).connect(capture).connect(mute).connect(audio.destination);
    log(`listening on ${mic.getAudioTracks()[0].label || 'the microphone'} for bursts around ${burst} Hz`);
  } catch (err) {
    mic = null;
    $('warn').textContent = `No microphone (${err.message}): sending without the backchannel, on map 0.`;
  }
}

function stop() {
  mic?.getTracks().forEach(t => t.stop());
  mic = null;
  clearInterval(timer);
  audio?.close();
  wakeLock?.release();
  audio = timer = wakeLock = null;
  if (!delivered) $('progressText').textContent = 'stopped';
  setLive(false);
}

function setLive(live) {
  const button = $('toggle');
  button.classList.toggle('live', live);
  button.title = live ? 'Stop' : 'Send';
  button.setAttribute('aria-label', button.title);
  $('seconds').disabled = $('file').disabled = live;
}

$('toggle').onclick = () => (audio ? stop() : start());
$('file').onchange = e => { if (e.target.files[0]) { file = e.target.files[0]; prepare(); } };
$('change').onclick = () => { if (!audio) $('file').click(); };
$('seconds').oninput = () => { $('secondsValue').textContent = `${seconds()} s`; };
$('seconds').onchange = prepare;
updateLink();
$('description').textContent = 'Choose a file, then press play.';
</script>
</body>
</html>
